[package]
name = "rustman"
version = "0.1.0"
edition = "2021"
description = "Cliente HTTP de escritorio al estilo Postman escrito en Rust"
authors = ["migdom"]

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "native-tls", "json", "multipart", "cookies", "gzip", "deflate"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
dirs = "5.0"
rfd = "0.15"
mime_guess = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "migdom"
copyright = "2026, migdom"
depends = "$auto"
section = "devel"
priority = "optional"
assets = [
    ["target/release/rustman", "usr/bin/", "755"],
]

[package.metadata.bundle]
name = "Rustman"
identifier = "com.migdom.rustman"
short_description = "Cliente HTTP de escritorio al estilo Postman escrito en Rust"
